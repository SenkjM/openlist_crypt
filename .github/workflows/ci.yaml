# Non-Android platforms (Linux / macOS / Windows / iOS) are not implemented
# yet ("其他平台暂未实装"), so their jobs are SKIPPED BY DEFAULT and, when
# enabled, run with continue-on-error so a failure never turns the run red.
# Android jobs and the platform-independent jobs always run and are blocking.
#
# How to enable the non-Android jobs (one switch for ci.yaml + flutter-build.yaml):
#   * permanently: Settings -> Secrets and variables -> Actions -> Variables,
#     add repository variable ENABLE_NON_ANDROID_CI = true
#     (or: gh variable set ENABLE_NON_ANDROID_CI --body true -R SenkjM/openlist_crypt)
#   * one-off: Actions -> this workflow -> Run workflow, tick "non_android"
#     (or: gh workflow run ci.yaml -f non_android=true -R SenkjM/openlist_crypt,
#          gh workflow run flutter-build.yaml -f non_android=true -R SenkjM/openlist_crypt)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      non_android:
        description: Also run the (not yet supported) non-Android platform jobs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze-test:
    name: dart analyze + dart test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  native-asset:
    # `dart test` runs hook/build.dart, which bundles the prebuilt libsodium
    # for the runner's OS/arch; the test asserts the bundled asset is the one
    # that loads and that it matches the pure-Dart secretbox byte-for-byte.
    # Non-Android: skipped unless enabled, never blocking (see top of file).
    name: bundled libsodium (${{ matrix.os }})
    if: ${{ vars.ENABLE_NON_ANDROID_CI == 'true' || inputs.non_android == true }}
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux x64
          - ubuntu-24.04-arm   # linux arm64
          - macos-latest       # macOS arm64
          - macos-15-intel     # macOS x64
          - windows-latest     # windows x64
          - windows-11-arm     # windows arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: dart test (expect bundled libsodium)
        run: dart test test/native_asset_test.dart test/secretbox_sodium_test.dart
        env:
          OPENLIST_CRYPT_EXPECT_BUNDLED: 'true'
      - name: dart test (full suite)
        run: dart test

  system-libsodium:
    name: OPENLIST_CRYPT_LIBSODIUM_PATH override (system libsodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: dart pub get
      - run: dart test test/secretbox_sodium_test.dart
        env:
          OPENLIST_CRYPT_LIBSODIUM_PATH: /usr/lib/x86_64-linux-gnu/libsodium.so.23

  publish-dry-run:
    name: dart pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
