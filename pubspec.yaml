name: openlist_crypt
description: >-
  rclone / OpenList crypt storage format in Dart: scrypt keys, EME filename
  encryption, XSalsa20-Poly1305 content, optional libsodium FFI backend.
version: 0.1.0
homepage: https://github.com/SenkjM/openlist_crypt
repository: https://github.com/SenkjM/openlist_crypt
issue_tracker: https://github.com/SenkjM/openlist_crypt/issues
topics:
  - rclone
  - encryption
  - cryptography
  - openlist
  - webdav

# Pure Dart (no Flutter dependency); usable from Flutter apps, CLIs and servers.
# Uses dart:io / dart:ffi for the optional libsodium backend, so web is not
# supported. Dart 3.10+ is required for build hooks (native assets), which
# bundle the prebuilt libsodium for the target platform/ABI only.
environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
